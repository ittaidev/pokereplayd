name: Subir scripts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p assets
          curl -fsSL -A "Mozilla/5.0" -o assets/routes-DpxeZ-5o.js "https://tmpfiles.org/dl/1794874389.007a2366ce3b449c/wrA7t0w3Joof/routes-dpxez-5o.js"
          curl -fsSL -A "Mozilla/5.0" -o assets/index-DFtLvS_j.js "https://tmpfiles.org/dl/1794874406.4427e447e7edbca9/wtAhtEwmJY0m/index-dftlvs_j.js"
          test "$(wc -c < assets/routes-DpxeZ-5o.js)" -eq 64912
          test "$(wc -c < assets/index-DFtLvS_j.js)" -eq 432089
      - name: Guardar
        run: |
          git config user.name "ittaidev"
          git config user.email "ittaidev@users.noreply.github.com"
          git add assets/routes-DpxeZ-5o.js assets/index-DFtLvS_j.js
          git rm -f .github/workflows/subir-scripts.yml
          git commit -m "Sube los scripts de PokéReplay"
          git push
